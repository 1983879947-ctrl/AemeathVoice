name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pyflakes

      - name: 检查 Python 语法
        run: |
          python -m py_compile scripts/aemeath_say.py
          python -m py_compile scripts/inference_api.py
          python -m py_compile scripts/launch_aemeath_api.py
          echo "✅ 所有脚本语法正确"

      - name: 检查 Markdown 链接
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.github/markdown-link-check.json'
