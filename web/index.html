<script>
const $ = id => document.getElementById(id);
const statusEl = $('status');
const synthBtn = $('synth');
const loadingEl = $('loading');
const playerEl = $('player');
const audioEl = $('audio');

// 检查 API 健康
async function checkHealth() {
  try {
    const r = await fetch('/health');
    const j = await r.json();
    if (j.status === 'ok') {
      statusEl.className = 'status ok';
      statusEl.textContent = `✓ API 就绪 · ${j.model} · ${j.device}${j.is_half ? ' · 半精度' : ''}`;
      synthBtn.disabled = false;
    } else {
      throw new Error(j.message || 'API 未就绪');
    }
  } catch (e) {
    statusEl.className = 'status error';
    statusEl.textContent = '✗ API 未启动 — 请先运行 start.bat';
    synthBtn.disabled = true;
  }
}

// 预设台词点击
document.querySelectorAll('.preset').forEach(el => {
  el.addEventListener('click', () => {
    $('text').value = el.dataset.text;
  });
});

async function synthesize() {
  const text = $('text').value.trim();
  if (!text) return alert('请输入要合成的文本');

  synthBtn.disabled = true;
  loadingEl.classList.add('active');
  playerEl.classList.remove('active');

  const t0 = Date.now();
  try {
    const r = await fetch('/tts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        text: text,
        text_language: $('lang').value,
        top_k: parseInt($('top_k').value),
        top_p: parseFloat($('top_p').value),
        temperature: parseFloat($('temperature').value),
      }),
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({ detail: r.statusText }));
      throw new Error(err.detail || '合成失败');
    }

    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    audioEl.src = url;
    audioEl.play();
    playerEl.classList.add('active');

    const duration = r.headers.get('X-Duration') || '?';
    const latency = r.headers.get('X-Latency') || (Date.now() - t0) / 1000;
    $('meta').textContent = `音频时长 ${duration}s · 合成耗时 ${latency}s`;
  } catch (e) {
    alert('合成失败: ' + e.message);
  } finally {
    synthBtn.disabled = false;
    loadingEl.classList.remove('active');
  }
}

// 回车提交（Shift+Enter 换行）
$('text').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    synthesize();
  }
});

checkHealth();
setInterval(checkHealth, 5000);
</script>
